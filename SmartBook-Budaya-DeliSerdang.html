    // --- HELPER AUDIO SYNTHESIZER & SOUND FX (Web Audio API) ---
    let globalAudioCtx = null;

    const getAudioContext = () => {
      if (!globalAudioCtx && typeof window !== 'undefined') {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          globalAudioCtx = new AudioContextClass();
        }
      }
      if (globalAudioCtx && globalAudioCtx.state === 'suspended') {
        globalAudioCtx.resume().catch(() => {});
      }
      return globalAudioCtx;
    };

    const playSound = (type) => {
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        const now = ctx.currentTime;

        if (type === 'click' || type === 'tab') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(400, now);
          osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
          osc.start(now);
          osc.stop(now + 0.08);
        } else if (type === 'card') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(300, now);
          osc.frequency.exponentialRampToValueAtTime(600, now + 0.12);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
          osc.start(now);
          osc.stop(now + 0.12);
        } else if (type === 'dice') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.linearRampToValueAtTime(660, now + 0.2);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
          osc.start(now);
          osc.stop(now + 0.2);
        } else if (type === 'correct') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.1);
          osc.frequency.setValueAtTime(783.99, now + 0.2);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
          osc.start(now);
          osc.stop(now + 0.35);
        } else if (type === 'wrong') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(160, now + 0.2);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
          osc.start(now);
          osc.stop(now + 0.2);
        } else if (type === 'fanfare') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.12);
          osc.frequency.setValueAtTime(783.99, now + 0.24);
          osc.frequency.setValueAtTime(1046.5, now + 0.36);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
          osc.start(now);
          osc.stop(now + 0.6);
        } else if (type === 'ladder') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(261.63, now);
          osc.frequency.linearRampToValueAtTime(880, now + 0.3);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
          osc.start(now);
          osc.stop(now + 0.3);
        } else if (type === 'snake') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(880, now);
          osc.frequency.linearRampToValueAtTime(220, now + 0.3);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
          osc.start(now);
          osc.stop(now + 0.3);
        }
      } catch (e) {
        console.log('Audio Error:', e);
      }
    };

    // --- WEB SPEECH API SYNTHESIS ---
    const speakText = (text, onStartCallback, onEndCallback) => {
      if (!('speechSynthesis' in window)) {
        console.error('Browser tidak mendukung Web Speech API.');
        return;
      }

      const synth = window.speechSynthesis;
      synth.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'id-ID';
      utterance.rate = 0.95;
      utterance.pitch = 1.0;

      utterance.onstart = () => {
        if (onStartCallback) onStartCallback();
      };

      utterance.onend = () => {
        if (onEndCallback) onEndCallback();
      };

      utterance.onerror = (event) => {
        console.error('Terjadi kesalahan audio:', event.error);
        if (onEndCallback) onEndCallback();
      };

      setTimeout(() => {
        synth.speak(utterance);
      }, 100);
    };

                    <span className="bg-white border-2 border-slate-800 px-3 py-1 rounded-full text-xs font-black text-slate-900">
                      Ditemukan: {foundWords.length} / {TARGET_WORDS.length}
                    </span>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6 items-center">
                    <div className="bg-white p-3 rounded-2xl border-3 border-slate-800 shadow-md max-w-xs mx-auto">
                      <div className="grid grid-cols-8 gap-1">
                        {WORD_SEARCH_GRID.map((row, rIdx) =>
                          row.map((char, cIdx) => {
                            const cellKey = `${rIdx}-${cIdx}`;
                            const isSelected = selectedCells.includes(cellKey);
                            return (
                              <button
                                key={cellKey}
                                onClick={() => handleCellClick(rIdx, cIdx)}
                                className={`w-7 h-7 md:w-8 md:h-8 rounded-lg font-black text-xs md:text-sm border-2 border-slate-800 transition-all flex items-center justify-center ${
                                  isSelected
                                    ? 'bg-amber-300 text-slate-900 scale-105 shadow-xs'
                                    : 'bg-slate-100 hover:bg-cyan-200 text-slate-800'
                                }`}
                              >
                                {char}
                              </button>
                            );
                          })
                        )}
                      </div>
                    </div>

                    <div className="space-y-3">
                      <p className="font-black text-xs text-slate-800">Daftar Kata Yang Harus Ditemukan:</p>
                      <div className="flex flex-wrap gap-2">
                        {TARGET_WORDS.map((word) => {
                          const isFound = foundWords.includes(word);
                          return (
                            <span
                              key={word}
                              className={`px-3 py-1.5 rounded-xl font-black text-xs border-2 border-slate-800 transition-all ${
                                isFound
                                  ? 'bg-emerald-400 text-slate-900 line-through'
                                  : 'bg-white text-slate-700'
                              }`}
                            >
                              {word} {isFound && '✓'}
                            </span>
                          );
                        })}
                      </div>
                      <button
                        onClick={() => setSelectedCells([])}
                        className="bg-slate-200 hover:bg-slate-300 border-2 border-slate-800 px-3 py-1.5 rounded-xl font-extrabold text-xs text-slate-800"
                      >
                        Bersihkan Pilihan Huruf
                      </button>
                    </div>
                  </div>
                </div>

                {/* BAGIAN C: QUIZ PILIHAN GANDA (5 SOAL) */}
                <div className="bg-emerald-100 border-4 border-slate-800 rounded-3xl p-6 shadow-[0_8px_0_#1e293b] space-y-4">
                  <div className="flex items-center justify-between border-b-2 border-emerald-300 pb-2">
                    <h3 className="text-lg font-black text-slate-900">
                      Bagian C: Quiz Evaluasi Pilihan Ganda
                    </h3>
                    {quizScore !== null && (
                      <span className="bg-amber-300 border-2 border-slate-800 px-3 py-1 rounded-full text-xs font-black text-slate-900">
                        Nilai Quiz: {quizScore} / 100
                      </span>
                    )}
                  </div>

                  <div className="space-y-4">
                    {LKPD_QUIZ.map((q, qIdx) => (
                      <div key={qIdx} className="bg-white p-4 rounded-2xl border-3 border-slate-800 space-y-2">
                        <p className="font-black text-sm text-slate-900">{q.q}</p>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                          {q.options.map((opt, oIdx) => {
                            const isSelected = quizAnswers[qIdx] === oIdx;
                            return (
                              <button
                                key={oIdx}
                                onClick={() => {
                                  playSound('click');
                                  setQuizAnswers({ ...quizAnswers, [qIdx]: oIdx });
                                }}
                                className={`p-2.5 rounded-xl border-2 border-slate-800 font-extrabold text-xs text-left transition-all ${
                                  isSelected
                                    ? 'bg-amber-300 text-slate-900 shadow-sm'
                                    : 'bg-slate-50 hover:bg-emerald-200 text-slate-800'
                                }`}
                              >
                                {String.fromCharCode(65 + oIdx)}. {opt}
                              </button>
                            );
                          })}
                        </div>
                      </div>
                    ))}

                    <button
                      onClick={handleQuizSubmit}
                      className="w-full bg-emerald-400 hover:bg-emerald-500 border-3 border-slate-800 py-3 rounded-2xl font-black text-sm text-slate-900 shadow-[0_4px_0_#1e293b] active:translate-y-1 active:shadow-none"
                    >
                      Hitung Nilai Evaluasi LKPD
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 7: ARENA GAMES */}
            {activeTab === 'games' && (
              <div className="space-y-6">
                <div className="bg-white border-4 border-slate-800 rounded-3xl p-6 shadow-[0_8px_0_#1e293b]">
                  <h2 className="text-2xl font-black text-slate-900">Arena Games Budaya Ceria</h2>
                  <p className="text-xs md:text-sm font-bold text-slate-600 mt-1">
                    Pilih gim interaktif favoritmu dan kumpulkan poin prestasi!
                  </p>
                </div>

                {/* GIM 1: PETUALANGAN DADU TRIVIA 10-PETAK */}
                <div className="bg-indigo-100 border-4 border-slate-800 rounded-3xl p-6 shadow-[0_8px_0_#1e293b] space-y-4">
                  <div className="flex items-center justify-between border-b-2 border-indigo-300 pb-2">
                    <div>
                      <span className="bg-indigo-300 text-slate-900 border border-slate-800 px-2.5 py-0.5 rounded-full text-[10px] font-black uppercase">
                        Game Mode 1
                      </span>
                      <h3 className="text-lg font-black text-slate-900 mt-1">🎲 Petualangan Dadu 10-Petak</h3>
                    </div>
                    <button
                      onClick={handleRollDice}
                      disabled={isRolling}
                      className="bg-indigo-400 hover:bg-indigo-500 border-3 border-slate-800 px-5 py-2.5 rounded-2xl font-black text-xs text-slate-900 shadow-[0_4px_0_#1e293b] active:translate-y-1 active:shadow-none disabled:opacity-50"
                    >
                      {isRolling ? 'Kocok Dadu...' : `Putar Dadu (Angka: ${diceVal})`}
                    </button>
                  </div>

                  <div className="grid grid-cols-2 sm:grid-cols-5 gap-2">
                    {DICE_GAME_TILES_10.map((tile) => {
                      const isPlayerHere = dicePos === tile.id;
                      return (
                        <div
                          key={tile.id}
                          className={`p-3 rounded-2xl border-3 border-slate-800 text-center transition-all flex flex-col justify-between ${
                            isPlayerHere
                              ? 'bg-amber-300 shadow-[0_4px_0_#1e293b] -translate-y-1'
                              : 'bg-white'
                          }`}
                        >
                          <div>
                            <p className="font-black text-xs text-slate-900">Petak {tile.id}</p>
                            <p className="text-[10px] font-bold text-slate-600 mt-0.5 truncate">{tile.title.split(':')[1]}</p>
                          </div>
                          {isPlayerHere && <div className="mt-2 text-xl animate-bounce">🏃🏻‍♂️</div>}
                        </div>
                      );
                    })}
                  </div>

                  {activeTrivia && (
                    <div className="bg-white p-4 rounded-2xl border-3 border-slate-800 space-y-3 animate-in fade-in">
                      <p className="font-black text-sm text-slate-900">❓ {activeTrivia.question}</p>
                      <div className="flex gap-2">
                        {activeTrivia.options.map((opt, idx) => (
                          <button
                            key={idx}
                            onClick={() => handleAnswerTrivia(idx)}
                            className="flex-1 bg-amber-200 hover:bg-amber-300 border-2 border-slate-800 py-2 rounded-xl font-black text-xs text-slate-900"
                          >
                            {opt}
                          </button>
                        ))}
                      </div>
                    </div>
                  )}
                </div>

                {/* GIM 2: ULAR TANGGA BUDAYA 2-PEMAIN (25 PETAK) */}
                <div className="bg-amber-100 border-4 border-slate-800 rounded-3xl p-6 shadow-[0_8px_0_#1e293b] space-y-4">
                  <div className="flex items-center justify-between flex-wrap gap-2 border-b-2 border-amber-300 pb-2">
                    <div>
                      <span className="bg-amber-300 text-slate-900 border border-slate-800 px-2.5 py-0.5 rounded-full text-[10px] font-black uppercase">
                        Game Mode 2
                      </span>
                      <h3 className="text-lg font-black text-slate-900 mt-1">
                        🐍 Ular Tangga Budaya (Si Deli vs Si Serdang)
                      </h3>
                    </div>
                    <div className="flex items-center gap-2">
                      <button
                        onClick={handleRollSnake}
                        className="bg-emerald-400 hover:bg-emerald-500 border-3 border-slate-800 px-4 py-2 rounded-2xl font-black text-xs text-slate-900 shadow-[0_4px_0_#1e293b] active:translate-y-1 active:shadow-none"
                      >
                        Kocok Dadu (Giliran: Pemain {turn})
                      </button>
                      <button
                        onClick={resetSnakeGame}
                        className="p-2 bg-slate-200 hover:bg-slate-300 border-2 border-slate-800 rounded-xl"
                        title="Reset Permainan"
                      >
                        <Icon name="RotateCcw" className="w-4 h-4 text-slate-800" />
                      </button>
                    </div>
                  </div>

                  <div className="bg-white p-3 rounded-2xl border-2 border-slate-800 font-bold text-xs text-slate-800 text-center">
                    📢 Log Permainan: {snakeLog}
                  </div>

                  <div className="bg-white p-3 rounded-2xl border-3 border-slate-800 max-w-md mx-auto">
                    <div className="grid grid-cols-5 gap-1.5">
                      {Array.from({ length: 25 }, (_, i) => 25 - i).map((tileNum) => {
                        const hasP1 = p1Pos === tileNum;
                        const hasP2 = p2Pos === tileNum;

                        const isLadder = tileNum === 3 || tileNum === 8 || tileNum === 15;
                        const isSnake = tileNum === 14 || tileNum === 19 || tileNum === 24;

                        return (
                          <div
                            key={tileNum}
                            className={`aspect-square rounded-xl border-2 border-slate-800 p-1 flex flex-col justify-between items-center relative text-center ${
                              tileNum === 25
                                ? 'bg-amber-300 font-black'
                                : isLadder
                                ? 'bg-emerald-200'
                                : isSnake
                                ? 'bg-rose-200'
                                : 'bg-slate-50'
                            }`}
                          >
                            <span className="text-[10px] font-black text-slate-600 self-start">{tileNum}</span>

                            {isLadder && <span className="text-xs" title="Tangga Naik">🪜</span>}
                            {isSnake && <span className="text-xs" title="Ular Turun">🐍</span>}

                            <div className="flex items-center justify-center gap-0.5 my-auto">
                              {hasP1 && <span className="text-base bg-cyan-300 border border-slate-800 rounded-full px-1" title="Si Deli">👦🏻</span>}
                              {hasP2 && <span className="text-base bg-amber-300 border border-slate-800 rounded-full px-1" title="Si Serdang">👧🏽</span>}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 8: SERTIFIKAT DUTA BUDAYA CILIK (READY PRINT) */}
            {activeTab === 'rapor' && (
              <div className="space-y-6">
                <div className="bg-white border-4 border-slate-800 rounded-3xl p-6 shadow-[0_8px_0_#1e293b] flex items-center justify-between flex-wrap gap-3 print:hidden">
                  <div>
                    <h2 className="text-2xl font-black text-slate-900">Sertifikat Duta Budaya Cilik</h2>
                    <p className="text-xs md:text-sm font-bold text-slate-600 mt-1">
                      Bukti kelulusan membaca Smart Book Budaya Lokal Deli Serdang.
                    </p>
                  </div>
                  <button
                    onClick={() => {
                      playSound('click');
                      window.print();
                    }}
                    className="bg-yellow-400 hover:bg-yellow-500 border-3 border-slate-800 px-5 py-2.5 rounded-2xl font-black text-xs text-slate-900 shadow-[0_4px_0_#1e293b] flex items-center gap-2 active:translate-y-1 active:shadow-none"
                  >
                    <Icon name="Printer" className="w-4 h-4" />
                    <span>Cetak / Print Sertifikat</span>
                  </button>
                </div>

                {/* PRINTABLE CERTIFICATE CARD */}
                <div className="bg-gradient-to-br from-amber-100 via-orange-50 to-yellow-100 border-8 border-amber-600 p-8 md:p-12 rounded-3xl shadow-xl max-w-3xl mx-auto text-center space-y-6 relative overflow-hidden print:border-4 print:p-6 print:shadow-none">
                  <div className="absolute top-4 left-4 w-12 h-12 border-t-4 border-l-4 border-amber-800"></div>
                  <div className="absolute top-4 right-4 w-12 h-12 border-t-4 border-r-4 border-amber-800"></div>
                  <div className="absolute bottom-4 left-4 w-12 h-12 border-b-4 border-l-4 border-amber-800"></div>
                  <div className="absolute bottom-4 right-4 w-12 h-12 border-b-4 border-r-4 border-amber-800"></div>

                  <div className="inline-block bg-amber-400 text-slate-900 px-4 py-1 rounded-full border-2 border-slate-800 font-black text-xs uppercase tracking-widest">
                    Sertifikat Penghargaan Resmi
                  </div>

                  <h2 className="text-3xl md:text-5xl font-black text-slate-900 font-serif tracking-tight">
                    DUTA BUDAYA CILIK
                  </h2>
                  <p className="text-xs md:text-sm font-bold text-slate-700">
                    Diberikan secara terhormat kepada siswa berprestasi:
                  </p>

                  <div className="py-2 border-b-4 border-slate-800 inline-block px-8">
                    <h3 className="text-2xl md:text-4xl font-black text-slate-900 underline decoration-amber-500 decoration-wavy">
                      {studentName || 'Nama Siswa'}
                    </h3>
                  </div>

                  <p className="text-xs md:text-sm font-bold text-slate-800 max-w-lg mx-auto leading-relaxed">
                    Telah menyelesaikan seluruh modul pembelajaran, tantangan Kamus 3 Suku, Evaluasi LKPD, dan Arena Games pada <span className="font-extrabold text-amber-900">Smart Book Budaya Lokal Deli Serdang</span> dengan Predikat Kelulusan Sangat Baik.
                  </p>

                  <div className="grid grid-cols-2 gap-4 max-w-md mx-auto bg-white/80 p-4 rounded-2xl border-2 border-slate-800 text-left">
                    <div>
                      <p className="text-[10px] font-black text-slate-500 uppercase">Sekolah / Asal:</p>
                      <p className="font-extrabold text-xs text-slate-900">{schoolName}</p>
                    </div>
                    <div>
                      <p className="text-[10px] font-black text-slate-500 uppercase">Kelas & Poin:</p>
                      <p className="font-extrabold text-xs text-slate-900">{studentClass} ({score} Poin)</p>
                    </div>
                  </div>

                  {/* ELEMEN TANDA TANGAN SERTIFIKAT (READY PRINT) */}
                  <div className="mt-8 pt-6 border-t-2 border-dashed border-amber-300 grid grid-cols-2 gap-8 text-center">
                    <div className="flex flex-col items-center justify-between h-32">
                      <p className="text-xs font-bold text-slate-700">
                        Mengetahui,<br />Guru / Wali Kelas
                      </p>
                      <div className="w-36 border-b-2 border-slate-800 pb-1">
                      </div>
                      <p className="text-xs font-black text-slate-900">
                        ( .................................... )
                      </p>
                      <p className="text-[10px] text-slate-500 font-semibold">NIP. ....................................</p>
                    </div>

                    <div className="flex flex-col items-center justify-between h-32">
                      <p className="text-xs font-bold text-slate-700">
                        Deli Serdang, {new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' })}<br />Kepala Sekolah
                      </p>
                      <div className="w-36 border-b-2 border-slate-800 pb-1">
                      </div>
                      <p className="text-xs font-black text-slate-900">
                        ( .................................... )
                      </p>
                      <p className="text-[10px] text-slate-500 font-semibold">NIP. ....................................</p>
                    </div>
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    // Render App Component
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
